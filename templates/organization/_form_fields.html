{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
<div class="row g-3">
    {% for field in form %}
    <div class="{% if field.name == 'roles' or field.name == 'measurable_items' or field.name == 'services' or field.name == 'weightings' %}col-12{% else %}col-12 col-md-6{% endif %}">
        <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="text-danger"> *</span>{% endif %}</label>
        {{ field }}
        {% if field.errors %}<div class="invalid-feedback d-block">{% for error in field.errors %}<div>{{ error }}</div>{% endfor %}</div>{% endif %}
        {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    </div>
    {% endfor %}
</div>
