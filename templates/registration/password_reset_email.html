<!doctype html>
<html lang="es">
<body style="margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#212529;">
  <div style="max-width:600px;margin:32px auto;background:#fff;border-top:5px solid #a60a17;padding:32px;">
    <h1 style="color:#a60a17;font-size:24px;">{{ site_name }}</h1>
    <p>Hola {{ user.get_username }},</p>
    <p>Recibimos una solicitud para restablecer la contraseña de tu cuenta.</p>
    <p style="margin:28px 0;">
      <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
         style="background:#a60a17;color:#fff;padding:12px 20px;text-decoration:none;border-radius:4px;">
        Restablecer contraseña
      </a>
    </p>
    <p>Si no solicitaste este cambio, puedes ignorar este correo. Tu contraseña actual seguirá siendo válida.</p>
    <p>Saludos,<br>{{ site_name }}</p>
  </div>
</body>
</html>
