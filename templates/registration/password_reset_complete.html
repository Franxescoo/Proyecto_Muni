{% extends "base.html" %}

{% block titulo %}Contraseña actualizada{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h3 mb-3">Contraseña actualizada</h1>
                <p class="text-muted">Tu contraseña se cambió correctamente.</p>
                <a class="btn recovery-button" href="{% url 'login' %}">Iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
<style>
    .recovery-button { background-color: #a60a17; border-color: #a60a17; color: #fff; }
    .recovery-button:hover { background-color: #800711; border-color: #800711; color: #fff; }
</style>
{% endblock %}
