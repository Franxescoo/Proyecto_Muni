{% extends "base.html" %}

{% block titulo %}Recuperar contraseña{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-3">Recuperar contraseña</h1>
                <p class="text-muted text-center">Ingresa tu correo electrónico y te enviaremos instrucciones para restablecerla.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn w-100 recovery-button" type="submit">Enviar instrucciones</button>
                </form>
                <a class="d-block text-center mt-3 recovery-link" href="{% url 'login' %}">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</div>
<style>
    .recovery-button { background-color: #a60a17; border-color: #a60a17; color: #fff; }
    .recovery-button:hover { background-color: #800711; border-color: #800711; color: #fff; }
    .recovery-link { color: #000; text-decoration: none; }
    .recovery-link:hover { text-decoration: underline; }
</style>
{% endblock %}
