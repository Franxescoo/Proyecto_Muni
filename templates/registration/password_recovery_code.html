<!doctype html>
<html lang="es">
<body style="margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#212529;">
  <div style="max-width:600px;margin:32px auto;background:#fff;border-top:5px solid #a60a17;padding:32px;">
    <h1 style="color:#a60a17;font-size:24px;">{{ site_name }}</h1>
    <p>Hola {{ user.get_username }},</p>
    <p>Tu código de recuperación es:</p>
    <p style="font-size:32px;letter-spacing:8px;font-weight:700;text-align:center;color:#a60a17;">
      {{ code }}
    </p>
    <p>Este código es válido durante <strong>5 minutos</strong> y solo puede utilizarse una vez.</p>
    <p>Si no solicitaste este cambio, puedes ignorar este correo.</p>
    <p>Saludos,<br>{{ site_name }}</p>
  </div>
</body>
</html>
