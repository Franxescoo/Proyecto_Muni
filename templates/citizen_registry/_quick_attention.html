<div class="col-12" id="citizenLookupWidget" data-lookup-url="{% url 'citizen_registry:lookup' %}">
  <div class="rounded-3 border p-3 mb-1 bg-light">
    <div class="fw-semibold mb-2"><i class="bi bi-person-vcard me-2"></i>Identificar ciudadano por RUT</div>
    <div class="row align-items-end g-2">
      <div class="col-md-8"><label for="{{ form.citizen_rut.id_for_label }}" class="form-label">RUT del ciudadano</label>{{ form.citizen_rut }}{% for error in form.citizen_rut.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
      <div class="col-md-4"><button type="button" class="btn btn-outline-danger w-100" id="citizenLookupButton"><i class="bi bi-search me-1"></i> Buscar RUT</button></div>
    </div>
    <div id="citizenLookupMessage" class="small mt-2" role="status">Busca el RUT para cargar los datos actuales desde Ciudadanos. Los campos personales no se modifican aquí.</div>
    {% if perms.citizen_registry.add_citizen %}<button type="button" class="btn btn-link text-danger p-0 small d-none" id="citizenQuickAdd">+ Agregar vecino no registrado</button>{% endif %}
  </div>
</div>
