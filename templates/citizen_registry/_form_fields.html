<div class="row g-3">
  {% for field in citizen_form %}
  <div class="{% if field.name == 'is_neighborhood_member' %}col-12{% else %}col-12 col-md-6{% endif %}" {% if field.name == 'neighborhood_group' or field.name == 'organization_role' %}data-community-field{% endif %}>
    {% if field.name == 'is_neighborhood_member' %}
    <div class="form-check mt-2">{{ field }} <label class="form-check-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
    {% else %}
    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ field }}
    {% endif %}
    {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
  </div>
  {% endfor %}
</div>
<datalist id="citizen-groups">
  {% for name in groups %}<option value="{{ name }}"></option>{% endfor %}
</datalist>
