
<script>
(function () {
    function updatePosition(employee) {
        const position = document.getElementById(
            employee.id.replace(/employee$/, 'position')
        );

        if (!position) return;

        const positions = JSON.parse(
            employee.dataset.goalPositions || "{}"
        );

        position.value = positions[employee.value] || '';

        const itemSelect = document.getElementById(
            employee.id.replace(/employee$/, 'measurement_item')
        );

        if (!itemSelect || itemSelect.disabled) return;

        const itemsPorCargo = JSON.parse(
            itemSelect.dataset.itemsByPosition || "{}"
        );

        const permitidos = itemsPorCargo[position.value] || [];

        Array.from(itemSelect.options).forEach(function (option) {
            if (!option.value) return;

            const historico = (
                employee.value === itemSelect.dataset.originalEmployee &&
                option.value === itemSelect.dataset.originalItem
            );

            const mostrar = permitidos.includes(option.value) || historico;

            option.hidden = !mostrar;
            option.disabled = !mostrar;
        });

        if (itemSelect.selectedOptions.length &&
            itemSelect.selectedOptions[0].disabled) {
            itemSelect.value = "";
            itemSelect.dispatchEvent(new Event("change", {
                bubbles: true
            }));
        }
    }

    document.querySelectorAll('[data-goal-positions]')
        .forEach(updatePosition);

    document.addEventListener('change', function (event) {
        if (event.target.matches('[data-goal-positions]')) {
            updatePosition(event.target);
        }
    });
})();
</script>
