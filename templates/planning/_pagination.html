{% if page.has_other_pages %}
<nav>
    <ul class="pagination pagination-sm">
        {% if page.has_previous %}
        <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">Anterior</a></li>
        {% endif %}
        <li class="page-item disabled"><span class="page-link">Página {{ page.number }} de {{ page.paginator.num_pages }}</span></li>
        {% if page.has_next %}
        <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Siguiente</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
