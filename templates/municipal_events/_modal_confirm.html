<div class="mec-modal-title"><i class="bi bi-trash me-2"></i>{{ title }}</div>
<p>¿Confirmas eliminar <strong>{{ object_label }}</strong>?</p>
{% if blocked %}<div class="alert alert-warning" role="alert">{{ blocked }}</div>{% endif %}
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
{% if not blocked %}
<form method="post" action="{{ request.path }}" data-mec-ajax-form>{% csrf_token %}
  <div class="modal-footer px-0 pb-0">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Eliminar definitivamente</button>
  </div>
</form>
{% else %}
<div class="modal-footer px-0 pb-0"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button></div>
{% endif %}
