{# Autoayuda compartida únicamente por Planificación y Eventos y Campañas. #}
<div class="sgr-selfhelp-toolbar" data-sgr-autohelp="{{ help_namespace }}:{{ help_section }}" data-sgr-help-module="{{ help_namespace }}" role="group" aria-label="Ayuda interactiva del módulo">
  <span class="sgr-selfhelp-caption"><i class="bi bi-patch-question" aria-hidden="true"></i> ¿Necesitas orientación?</span>
  <button type="button" class="btn btn-outline-danger btn-sm sgr-selfhelp-tour-start" data-sgr-tour-start>
    <i class="bi bi-signpost-split me-1" aria-hidden="true"></i> Iniciar tutorial
  </button>
  <button type="button" class="btn btn-outline-secondary btn-sm sgr-selfhelp-guide-toggle" data-sgr-guide-toggle aria-pressed="false">
    <i class="bi bi-layout-sidebar-reverse me-1" aria-hidden="true"></i><span data-sgr-guide-label>Ocultar guía lateral</span>
  </button>
</div>
